<div class="modal-header align-items-center justify-content-between">
  <h4 ngbAutoFocus class="modal-title">Reconciliation of selected cards</h4>
</div>
<div class="modal-body">
  <form [formGroup]="formGroup">
    <!--{{formGroup.value | json}}-->
    <div class="row mb-3">
      <div class="col-4">
        <label>Deposit Bank Account</label>
      </div>
      <div class="col-8">
        <ng-select placeholder="Bank Account" formControlName="bankId" [items]="bankAccountList"
                   bindLabel="accountName" bindValue="accountId">
          <ng-template ng-option-tmp let-item="item">
            {{item?.accountName + '-' + item?.bankNameEnglish + '-' +  item?.accountNumber}}
          </ng-template>
        </ng-select>
        <validation-error [control]="f.get('bankId')" [errorMessages]="{required:'Input is required'}"></validation-error>
      </div>
    </div>
    <div class="row mb-3">
      <div class="col-4">
        <label>Deposit Date</label>
      </div>
      <div class="col-8">
        <div class="input-group">
          <input type="text" formControlName="date"
                 placeholder="Select Date" class="form-control custom-input-field" bsDatepicker
                 [bsConfig]="{ containerClass: 'theme-red', isAnimated: true, showClearButton: true }"
                 #drp="bsDatepicker">
          <span class="input-group-text cursor-pointer" (click)="drp.toggle()"><img class="calender" src="/assets/images/calendar.png" alt="" /></span>
        </div>
        <validation-error [control]="f.get('date')" [errorMessages]="{required:'Input is required'}"></validation-error>
      </div>
    </div>
    <div class="row mb-3">
      <div class="col-4">
        <label>Total Amount</label>
      </div>
      <div class="col-8">
        <h6 class="fw-600">{{data?.totalAmount | number:'2.3-3'}} {{currency}}</h6>
      </div>
    </div>
    <div class="row mb-3">
      <div class="col-4">
        <label>Commission Amount</label>
      </div>
      <div class="col-8">
        <div class="input-group">
          <input type="text" decimalNumber placeholder="Commission Amount" (change)="handleCommissionAmountChange($event)" class="form-control height-47">
        </div>
        <validation-error [control]="f.get('commission')" [errorMessages]="{inValidAmount:'Commission amount cannot be greater than total amount.'}"></validation-error>
      </div>
    </div>
    <div class="row mb-3">
      <div class="col-4">
        <label>Commission Percentage</label>
      </div>
      <div class="col-8">
        <div class="input-group">
          <input type="text" decimalNumber formControlName="commission" placeholder="Commission Percentage" class="form-control height-47">
          <span class="input-group-text">%</span>
        </div>
        <validation-error [control]="f.get('commission')"
                          [errorMessages]="{required:'Input is required',min:'Value must be in 0-100 range.',max:'Value must be in 0-100 range.'}">

        </validation-error>
      </div>
    </div>
  </form>
  <ng-container>
    <app-table-advanced [config]="tableConfig" [columns]="tableColumns" [data]="reconList">
    </app-table-advanced>
  </ng-container>
</div>
<div class="modal-footer border-0">
  <button class="btn btn-add" type="button" [disabled]="formGroup.invalid" (click)="handleCheckRecon()">Check Reconciliation</button>
  <button class="btn btn-add" type="button" [disabled]="formGroup.invalid" (click)="save()">Group Reconciliation</button>
  <button class="btn btn-cancel" type="button" (click)="_activeModal.close()">Cancel</button>
</div>
